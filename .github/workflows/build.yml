name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/**/*
          compression-level: 9
      - name: Upload stats
        uses: actions/upload-artifact@v6
        with:
          name: build-stats
          path: stats.html
          compression-level: 9
